name: Testing

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.2', '8.1' ]

    services:
      database:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wordpress_tests
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare test configuration
        run: |
          cp tests/wp-tests-config.sample.php "$RUNNER_TEMP/wp-tests-config.php"
          sed -i "s/'root'/'root'/; s/'127.0.0.1'/'127.0.0.1'/" "$RUNNER_TEMP/wp-tests-config.php"

      - name: Run tests
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ runner.temp }}/wp-tests-config.php
        run: composer test
